name: ERP daily upload

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST
  workflow_dispatch:
    inputs:
      jobs:
        description: "Uploads to run: bucket1, perf, sales (comma list)"
        default: "bucket1,sales"
      dry_run:
        description: "Download and check the reports without uploading"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: erp-daily-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install Playwright
        run: |
          pip install -r automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pick uploads to run
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_JOBS: ${{ github.event.inputs.jobs }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            jobs="${INPUT_JOBS:-bucket1,sales}"
          else
            # Scheduled runs can start late, so decide by the IST date at run time.
            jobs="bucket1,sales"
            if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
              jobs="bucket1,sales,perf"
            fi
          fi
          echo "Running jobs: $jobs (IST date $(TZ=Asia/Kolkata date +%F))"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Download ERP reports and upload to LeadLens
        working-directory: automation
        env:
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LEADLENS_USER: ${{ secrets.LEADLENS_USER }}
          LEADLENS_PASS: ${{ secrets.LEADLENS_PASS }}
          JOBS: ${{ steps.pick.outputs.jobs }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python erp_upload.py

      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erp-screenshots
          path: automation/screenshots/
          retention-days: 3
          if-no-files-found: ignore
