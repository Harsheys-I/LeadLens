name: Sync hostinger deploy branch

on:
  push:
    branches: [main]
    paths:
      - "web-app/**"
      - ".github/workflows/sync-hostinger-branch.yml"
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote /dev to live"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-hostinger
  cancel-in-progress: true

jobs:
  sync-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.promote != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync web-app/ to hostinger/dev/
        env:
          BRANCH: hostinger
        run: |
          set -euo pipefail

          if [ ! -d web-app ]; then
            echo "web-app/ missing; aborting"
            exit 1
          fi

          STAGING="$(mktemp -d)"
          rsync -a \
            --exclude='.github' \
            --exclude='.git' \
            web-app/ "$STAGING/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            # First-time: seed live root from current web-app as well
            rsync -a "$STAGING"/ ./
          fi

          mkdir -p dev
          rsync -a --delete \
            --exclude='.github' \
            --exclude='.git' \
            "$STAGING"/ ./dev/

          # On main push, promote staging to live site root (not /dev-only).
          if [ "${{ github.event_name }}" = "push" ]; then
            rsync -a --delete \
              --exclude='/.git' \
              --exclude='/.github' \
              --exclude='/dev' \
              ./dev/ ./
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No changes for $BRANCH; skipping push"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            git commit -m "Sync web-app/ to live site and /dev"
          else
            git commit -m "Sync /dev from web-app/"
          fi
          git push origin "HEAD:$BRANCH"

  promote:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hostinger
        uses: actions/checkout@v4
        with:
          ref: hostinger
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote dev/ to site root
        env:
          BRANCH: hostinger
        run: |
          set -euo pipefail

          if [ ! -d dev ]; then
            echo "dev/ missing on hostinger branch; aborting"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Copy staging over live root. Excluded dest names are not deleted
          # (no --delete-excluded), so /dev stays as the next preview and .git is kept.
          rsync -a --delete \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/dev' \
            ./dev/ ./

          git add -A
          if git diff --cached --quiet; then
            echo "Live root already matches /dev; skipping push"
            exit 0
          fi

          git commit -m "Promote /dev to live site root"
          git push origin "HEAD:$BRANCH"
