<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPP AI</title>
    <script>
      (function () {
        var KEY = 'leadlens.theme'
        var pref = 'system'
        try { pref = localStorage.getItem(KEY) || 'system' } catch (e) {}
        if (pref !== 'light' && pref !== 'dark') pref = 'system'
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme-pref', pref)
        var path = location.pathname || ''
        if (path === '/dev' || path.indexOf('/dev/') === 0) {
          document.documentElement.classList.add('ll-dev-preview')
        }
      })()
    </script>
    <script type="module" crossorigin src="./assets/main-BCyIQm82.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-DN5MK3UF.css">
  </head>
  <body>
    <div class="ll-preview-banner" aria-hidden="true">Preview</div>
    <div id="root"></div>
  </body>
</html>
